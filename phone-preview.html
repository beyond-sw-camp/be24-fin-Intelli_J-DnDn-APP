<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DnDn Mobile Preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #18181b;
        --panel: #27272a;
        --line: #3f3f46;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(240px, 320px) 1fr;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      aside {
        border-right: 1px solid var(--line);
        padding: 28px 22px;
        background: #111113;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      select,
      button,
      input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      select,
      input {
        padding: 0 12px;
      }

      button {
        cursor: pointer;
        font-weight: 800;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      main {
        min-width: 0;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .phone {
        width: var(--phone-width, 390px);
        height: var(--phone-height, 844px);
        border: 10px solid #050505;
        border-radius: 38px;
        background: #000;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        position: relative;
      }

      .speaker {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 50%;
        width: 96px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 0 0 14px 14px;
        background: #050505;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      @media (max-width: 860px) {
        body {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        main {
          align-items: start;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>현장출입증 프리뷰</h1>
      <p>PC 브라우저에서 모바일 앱 화면 비율로 확인하는 개발용 프레임입니다.</p>

      <label for="device">기기 크기</label>
      <select id="device">
        <option value="390x844">iPhone 14</option>
        <option value="393x852">Pixel 7</option>
        <option value="360x800">Small Android</option>
        <option value="430x932">Large Phone</option>
      </select>

      <label for="path">화면</label>
      <select id="path">
        <option value="/login">로그인</option>
        <option value="/tabs/home">홈</option>
        <option value="/tabs/pass">출입증</option>
        <option value="/tabs/attendance">근태</option>
        <option value="/tabs/profile">내 정보</option>
      </select>

      <label for="origin">Expo Web 주소</label>
      <input id="origin" value="http://localhost:8081" />

      <div class="stack" style="margin-top: 16px">
        <button class="primary" id="open">열기</button>
        <button id="reload">새로고침</button>
      </div>
    </aside>

    <main>
      <section class="phone" id="phone">
        <div class="speaker"></div>
        <iframe id="app" title="DnDn mobile app preview" src="http://localhost:8081/login"></iframe>
      </section>
    </main>

    <script>
      const phone = document.getElementById("phone");
      const frame = document.getElementById("app");
      const device = document.getElementById("device");
      const path = document.getElementById("path");
      const origin = document.getElementById("origin");

      function applyDevice() {
        const [width, height] = device.value.split("x");
        phone.style.setProperty("--phone-width", `${width}px`);
        phone.style.setProperty("--phone-height", `${height}px`);
      }

      function openRoute() {
        frame.src = `${origin.value.replace(/\/$/, "")}${path.value}`;
      }

      device.addEventListener("change", applyDevice);
      document.getElementById("open").addEventListener("click", openRoute);
      document.getElementById("reload").addEventListener("click", () => frame.contentWindow?.location.reload());
      applyDevice();
    </script>
  </body>
</html>
